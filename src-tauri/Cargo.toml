[package]
name = "zimage-studio"
version = "0.2.8"
description = "Z-Image Studio - 一体化生图工作台 (ComfyUI + LoRA 训练 + 资源中心)"
authors = ["Z-Image Studio"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "zimage_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
minisign-verify = "0.2"
semver = "1"
base64 = "0.22"

[profile.release]
strip = true

